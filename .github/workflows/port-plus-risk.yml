name: Port Plus Risk Control

on:
  push:
    branches:
      - feat/plus-risk-audit-v0.2.2
    paths:
      - '.github/workflows/port-plus-risk.yml'

permissions:
  contents: write

env:
  PORT_REVISION: '10'

jobs:
  port-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Prepare v0.2.2 shared ingress adaptations
        run: python3 .github/scripts/prepare-plus-risk-v022.py

      - name: Port Plus final risk-control state
        run: bash .github/scripts/port-plus-risk.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Backend unit tests
        working-directory: backend
        run: make test-unit

      - name: Backend integration tests
        working-directory: backend
        run: make test-integration

      - name: Frontend typecheck and critical tests
        run: make test-frontend

      - name: Focused security-audit tests
        working-directory: backend
        run: go test ./internal/auditcontent/... ./internal/securityaudit/... ./internal/service/... ./internal/repository/... ./internal/handler/... ./internal/server/... -count=1

      - name: Commit tested port to branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < backend/cmd/server/VERSION)" = '0.2.2'
          git rm .github/workflows/port-plus-risk.yml .github/scripts/port-plus-risk.sh .github/scripts/prepare-plus-risk-v022.py
          git add -A
          if git diff --cached --quiet; then
            echo '::error::No integration changes produced'
            exit 1
          fi
          git commit -m 'feat(risk): port Plus security audit to v0.2.2'
          git push origin HEAD:feat/plus-risk-audit-v0.2.2
