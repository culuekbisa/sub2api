name: Verify Plus Risk Control

on:
  push:
    branches:
      - feat/plus-risk-audit-v0.2.2
    paths:
      - '.github/workflows/port-plus-risk.yml'

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Verify target version
        run: test "$(tr -d '\r\n' < backend/cmd/server/VERSION)" = '0.2.2'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Focused security-audit tests
        working-directory: backend
        run: go test ./internal/securityaudit/... ./internal/service/... ./internal/repository/... ./internal/handler/... ./internal/server/... -count=1
