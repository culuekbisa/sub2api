name: Port Plus Risk Control

on:
  push:
    branches:
      - feat/plus-risk-audit-v0.2.2
    paths:
      - '.github/workflows/port-plus-risk.yml'

permissions:
  contents: write

jobs:
  port-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Port Plus final risk-control state
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add lucky https://github.com/LuckyKuang/sub2api-plus.git
          git fetch --no-tags lucky main

          test "$(tr -d '\r\n' < backend/cmd/server/VERSION)" = '0.2.2'
          SHARED_BASE="$(git merge-base HEAD lucky/main)"
          echo "shared base: $SHARED_BASE"

          git diff --name-only "$SHARED_BASE" lucky/main > /tmp/lucky-changed.txt
          : > /tmp/risk-files.txt

          # Select every final Lucky change whose path or diff actually belongs to
          # Security Audit / Prompt Audit / Content Moderation. This catches the
          # obvious feature-owned files and thin integration hunks in shared files.
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              backend/internal/auditcontent/*|backend/internal/securityaudit/*|backend/internal/service/content_moderation*.go|backend/internal/repository/content_moderation*.go|backend/internal/handler/admin/content_moderation*.go|backend/internal/handler/content_moderation*.go|backend/internal/handler/security_audit*.go|backend/internal/handler/openai_live*.go|frontend/src/features/prompt-audit/*|frontend/src/*/risk-control/*|frontend/src/*/prompt-audit/*|docs/SECURITY_AUDIT_CONTENT_COVERAGE.md)
                echo "$file" >> /tmp/risk-files.txt
                continue
                ;;
            esac
            if git diff "$SHARED_BASE" lucky/main -- "$file" | grep -Eq 'ContentModeration|content_moderation|securityaudit|SecurityAudit|security_audit|PromptAudit|prompt_audit|prompt-audit|risk_control|risk-control|SessionBlock|session_block|CyberPolicyAutoBan'; then
              echo "$file" >> /tmp/risk-files.txt
            fi
          done < /tmp/lucky-changed.txt
          sort -u -o /tmp/risk-files.txt /tmp/risk-files.txt

          echo 'Selected final risk-control files:'
          cat /tmp/risk-files.txt

          # SQL migrations are copied separately so custom migration numbers can
          # never collide with the newer v0.2.2 migration chain.
          grep '^backend/migrations/.*\.sql$' /tmp/risk-files.txt > /tmp/risk-migrations.txt || true
          grep -v '^backend/migrations/.*\.sql$' /tmp/risk-files.txt > /tmp/risk-non-migrations.txt || true

          # Apply one final-state delta per shared file. Risk-owned files that the
          # v0.2.2 line never touched can be taken verbatim from Lucky current main.
          # Files changed by both sides get a real three-way merge from the common
          # ancestor, preserving upstream 0.2.2 changes instead of downgrading them.
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if git diff --quiet "$SHARED_BASE" HEAD -- "$file"; then
              if git cat-file -e "lucky/main:$file" 2>/dev/null; then
                echo "final-copy: $file"
                git checkout lucky/main -- "$file"
              elif [ -e "$file" ]; then
                git rm -- "$file"
              fi
              continue
            fi

            patch="/tmp/final-$(echo "$file" | tr '/ ' '__').patch"
            git diff --binary "$SHARED_BASE" lucky/main -- "$file" > "$patch"
            [ -s "$patch" ] || continue
            echo "three-way adapt: $file"
            if ! git apply --3way --index "$patch"; then
              echo "::error title=v0.2.2 risk integration conflict::$file needs explicit adaptation"
              git status --short
              git diff --name-only --diff-filter=U || true
              exit 1
            fi
          done < /tmp/risk-non-migrations.txt

          # Import only Lucky-only risk migrations. If the same semantic suffix
          # already exists upstream, skip it. Otherwise preserve the original
          # number when free; on collision allocate monotonically after current max.
          current_max=$(find backend/migrations -maxdepth 1 -type f -name '[0-9]*_*.sql' -printf '%f\n' \
            | sed -nE 's/^([0-9]+)_.*/\1/p' | sort -n | tail -1)
          current_max=${current_max:-0}
          : > /tmp/migration-map.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            base="${file##*/}"
            old_num="${base%%_*}"
            suffix="${base#*_}"
            if find backend/migrations -maxdepth 1 -type f -name "[0-9]*_${suffix}" | grep -q .; then
              echo "migration already represented: $suffix"
              continue
            fi
            target="$base"
            if find backend/migrations -maxdepth 1 -type f -name "${old_num}_*.sql" | grep -q .; then
              current_max=$((current_max + 1))
              target="${current_max}_${suffix}"
            fi
            echo "migration: $base -> $target"
            git show "lucky/main:$file" > "backend/migrations/$target"
            printf '%s\t%s\n' "$base" "$target" >> /tmp/migration-map.txt
          done < /tmp/risk-migrations.txt

          # Rewrite migration filename references in copied tests/docs when a
          # custom number had to move.
          while IFS=$'\t' read -r old new; do
            [ -n "$old" ] || continue
            grep -rlZ --exclude-dir=.git "$old" backend docs frontend 2>/dev/null \
              | xargs -0 -r sed -i "s#${old}#${new}#g"
          done < /tmp/migration-map.txt

          # Adapt Plus module imports to this fork's upstream module identity.
          grep -rlZ --exclude-dir=.git 'github.com/LuckyKuang/sub2api-plus' backend frontend 2>/dev/null \
            | xargs -0 -r sed -i 's#github.com/LuckyKuang/sub2api-plus#github.com/Wei-Shaw/sub2api#g'

          printf '0.2.2\n' > backend/cmd/server/VERSION

          mapfile -d '' gofiles < <(git diff --name-only -z -- '*.go')
          if [ "${#gofiles[@]}" -gt 0 ]; then
            gofmt -w "${gofiles[@]}"
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          ! grep -R 'github.com/LuckyKuang/sub2api-plus' backend frontend
          test "$(tr -d '\r\n' < backend/cmd/server/VERSION)" = '0.2.2'

          # Migration versions must remain unique.
          duplicates=$(find backend/migrations -maxdepth 1 -type f -name '[0-9]*_*.sql' -printf '%f\n' \
            | sed -nE 's/^([0-9]+)_.*/\1/p' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate migration versions: $duplicates"
            exit 1
          fi

          echo 'Integration diff summary:'
          git status --short
          git diff --stat
          git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Backend unit tests
        working-directory: backend
        run: make test-unit

      - name: Backend integration tests
        working-directory: backend
        run: make test-integration

      - name: Frontend typecheck and critical tests
        run: make test-frontend

      - name: Focused security-audit tests
        working-directory: backend
        run: go test ./internal/auditcontent/... ./internal/securityaudit/... ./internal/service/... ./internal/repository/... ./internal/handler/... ./internal/server/... -count=1

      - name: Commit tested port to branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < backend/cmd/server/VERSION)" = '0.2.2'
          git rm .github/workflows/port-plus-risk.yml
          git add -A
          if git diff --cached --quiet; then
            echo '::error::No integration changes produced'
            exit 1
          fi
          git commit -m 'feat(risk): port Plus security audit to v0.2.2'
          git push origin HEAD:feat/plus-risk-audit-v0.2.2
