name: Cleanup v0.2.0-fork.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-v0.2.0-fork.2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'culuekbisa/sub2api'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release delete v0.2.0-fork.2 \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes
