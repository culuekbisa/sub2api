name: Sync Upstream

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upstream-sync.yml'
  schedule:
    # Once a day at 03:17 UTC (11:17 Asia/Shanghai). The fork's Actions budget was
    # throttled while this ran every 15 minutes, so keep the cadence low.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing fork tag to (re)dispatch Release for'
        required: false
        type: string

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'culuekbisa/sub2api'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      merge_state: ${{ steps.merge.outputs.merge_state }}
      unresolved: ${{ steps.merge.outputs.unresolved }}
    steps:
      # fork 的 GITHUB_TOKEN 没有 workflows 权限，上游一旦改 .github/workflows/*.yml
      # 就会被 "refusing to allow a GitHub App to create or update workflow" 拒绝推送，
      # 因此用带 workflow 权限的 PAT（仓库 secret SYNC_TOKEN）执行 checkout 与 push。
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.SYNC_TOKEN }}

      # 合并本身不需要 Go/Node。needs_verify 由本步骤算出，工具链按需安装，
      # 使「上游没动」和「上游只动文档/CI」的日常同步不产生任何构建开销。
      - name: Merge upstream/main
        id: merge
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch --prune origin main
          git fetch --prune upstream main
          git checkout -B main origin/main

          # 先按「不需要验证」的保守默认值填好所有输出，后续再按需改写。
          echo "needs_verify=false" >> "$GITHUB_OUTPUT"
          echo "touches_backend=false" >> "$GITHUB_OUTPUT"
          echo "touches_frontend=false" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'upstream/main is already contained in origin/main'
            echo "merge_state=up-to-date" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare the VERSION at the last shared upstream commit with the
          # current upstream/main VERSION. This detects upstream version bumps
          # only, while ignoring README/docs/CI-only upstream commits.
          MERGE_BASE="$(git merge-base origin/main upstream/main)"
          PREVIOUS_VERSION="$(git show "${MERGE_BASE}:backend/cmd/server/VERSION" | tr -d '\r\n')"
          UPSTREAM_VERSION="$(git show "upstream/main:backend/cmd/server/VERSION" | tr -d '\r\n')"

          if [ -z "$PREVIOUS_VERSION" ] || [ -z "$UPSTREAM_VERSION" ]; then
            echo '::error::Could not read upstream VERSION before/after sync'
            exit 1
          fi

          PREVIOUS_VERSION="${PREVIOUS_VERSION#v}"
          UPSTREAM_VERSION="${UPSTREAM_VERSION#v}"
          echo "previous_upstream_version=$PREVIOUS_VERSION"
          echo "upstream_version=$UPSTREAM_VERSION"
          echo "previous_upstream_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$PREVIOUS_VERSION" = "$UPSTREAM_VERSION" ]; then
            VERSION_CHANGED=false
          else
            VERSION_CHANGED=true
          fi

          # Migration safety gate. Migrations are embedded in the binary and
          # applied at startup, so an auto-merge that rewrites or deletes an
          # already-applied migration changes its checksum and makes the next
          # boot fail on every deployment. Additive migrations are safe to take
          # automatically; anything else is a human decision.
          MIGRATION_CHANGES="$(git diff --name-status "${MERGE_BASE}" upstream/main -- backend/migrations || true)"
          # grep exits 1 on no match, which set -e would treat as failure, so every
          # pipeline that may legitimately match nothing is guarded.
          MIGRATION_REVIEW="$(printf '%s\n' "${MIGRATION_CHANGES}" | grep -E '^(M|D|R|C|T)' || true)"
          MIGRATION_ADDED="$(printf '%s\n' "${MIGRATION_CHANGES}" | grep -E '^A' | awk '{print $2}' | paste -sd, - || true)"
          echo "migration_added=${MIGRATION_ADDED}"

          if [ -n "${MIGRATION_REVIEW}" ]; then
            echo '::error::Upstream rewrote or removed an existing migration; manual review required'
            printf '%s\n' "${MIGRATION_REVIEW}"
            {
              echo '### Upstream sync needs a manual migration review'
              echo
              echo "upstream/main advances to VERSION \`${UPSTREAM_VERSION}\` and touches migrations that already shipped."
              echo
              echo "Applied migrations are checksum-verified at boot, so merging these automatically can make every deployment fail to start:"
              echo
              printf '%s\n' "${MIGRATION_REVIEW}" | awk '{print "- `" $2 "` (" $1 ")"}'
              echo
              echo "Rebase the fork's \`main\` onto upstream manually, reconcile the migration bodies (and any checksum-compatibility rule in \`backend/internal/repository/migrations_runner.go\`), then push."
              echo
              echo "The merge was aborted, so \`main\` is untouched. See the [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "migration_review=$(printf '%s\n' "${MIGRATION_REVIEW}" | awk '{print $2}' | paste -sd, -)" >> "$GITHUB_OUTPUT"
            echo 'merge_state=migration' >> "$GITHUB_OUTPUT"
            exit 1
          fi

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_status=$?
          set -e

          resolver_used=false
          if [ "$merge_status" -ne 0 ]; then
            # Additive settings conflicts are union-resolved by the checker; the
            # remaining files are left conflicted for a human. The resolver never
            # decides on the fork's risk-control files.
            python .github/sync-tools/resolve_settings_conflicts.py --root . || true

            unresolved="$(git diff --name-only --diff-filter=U | paste -sd, -)"
            echo "unresolved=$unresolved" >> "$GITHUB_OUTPUT"

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo 'merge_state=conflict' >> "$GITHUB_OUTPUT"
              git merge --abort || true
              exit 0
            fi
            # 并集解析是文本猜测，必须由编译/类型检查确认后才能提交。
            resolver_used=true
          fi

          # 记录这次合并实际落在哪些工具链目录，供按需安装与验证使用。
          merged_paths="$(git diff --cached --name-only)"
          touches_backend=false
          touches_frontend=false
          if printf '%s\n' "$merged_paths" | grep -q '^backend/'; then touches_backend=true; fi
          if printf '%s\n' "$merged_paths" | grep -q '^frontend/'; then touches_frontend=true; fi
          echo "touches_backend=$touches_backend" >> "$GITHUB_OUTPUT"
          echo "touches_frontend=$touches_frontend" >> "$GITHUB_OUTPUT"

          # 只有两种情况必须过工具链：
          #   1. 上游 VERSION 变了 —— 这次合并要出 Release，产物必须能构建；
          #   2. 走了并集解析 —— 文本并集只是猜测，必须由编译/类型检查确认。
          # 其余情况（无冲突的日常合并）只做 merge + push，把 fork 仅剩的
          # Actions 预算留给真正需要构建的合并。
          if [ "$VERSION_CHANGED" = 'true' ] || [ "$resolver_used" = 'true' ]; then
            needs_verify=true
          else
            needs_verify=false
          fi
          echo "needs_verify=$needs_verify" >> "$GITHUB_OUTPUT"
          echo "merge_state=ready" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "plan: needs_verify=$needs_verify version_changed=$VERSION_CHANGED resolver_used=$resolver_used backend=$touches_backend frontend=$touches_frontend"

      - name: Set up Go
        if: steps.merge.outputs.needs_verify == 'true' && steps.merge.outputs.touches_backend == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        if: steps.merge.outputs.needs_verify == 'true' && steps.merge.outputs.touches_frontend == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        if: steps.merge.outputs.needs_verify == 'true' && steps.merge.outputs.touches_frontend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 每个 gate 只对这次合并真正触碰的工具链运行：前后端互不牵连，
      # 一个无关的 pnpm 抖动不会否掉一次干净的 Go-only 合并。
      - name: Verify merged tree
        if: steps.merge.outputs.merge_state == 'ready' && steps.merge.outputs.needs_verify == 'true'
        shell: bash
        env:
          TOUCHES_BACKEND: ${{ steps.merge.outputs.touches_backend }}
          TOUCHES_FRONTEND: ${{ steps.merge.outputs.touches_frontend }}
          UPSTREAM_VERSION: ${{ steps.merge.outputs.upstream_version }}
        run: |
          set -Eeuo pipefail
          failed=''
          go_result='not run'
          vue_result='not run'
          if [ "$TOUCHES_BACKEND" = 'true' ]; then
            if (cd backend && go build ./...) >/dev/null 2>&1; then
              echo 'go build: ok'
              go_result='ok'
            else
              echo 'go build: failed'
              go_result='failed'
              failed='backend'
            fi
          fi
          if [ -z "$failed" ] && [ "$TOUCHES_FRONTEND" = 'true' ]; then
            if (cd frontend && pnpm install --frozen-lockfile >/dev/null 2>&1 && pnpm run typecheck >/dev/null 2>&1); then
              echo 'vue-tsc: ok'
              vue_result='ok'
            else
              echo 'vue-tsc: failed'
              vue_result='failed'
              failed='frontend'
            fi
          fi
          if [ -n "$failed" ]; then
            # 验证失败时不提交：main 保持不动，交给人工合并。这里直接写摘要，
            # 因为 merge_state 是 ready，下面的 conflict 报告步骤不会触发。
            {
              echo "### Upstream merge failed $failed verification"
              echo
              echo "upstream/main advances to VERSION \`$UPSTREAM_VERSION\` and merged without"
              echo 'text conflicts, but the merged tree does not build.'
              echo
              echo "- \`go build ./...\`: $go_result"
              echo "- \`pnpm run typecheck\`: $vue_result"
              echo
              echo "The merge was aborted, so \`main\` is untouched. See the [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            echo "::error::Merged tree failed $failed verification; main is untouched"
            exit 1
          fi

      - name: Commit and push merge
        if: steps.merge.outputs.merge_state == 'ready'
        shell: bash
        env:
          NEEDS_VERIFY: ${{ steps.merge.outputs.needs_verify }}
          VERSION_CHANGED: ${{ steps.merge.outputs.version_changed }}
          UPSTREAM_VERSION: ${{ steps.merge.outputs.upstream_version }}
        run: |
          set -Eeuo pipefail
          if [ "$NEEDS_VERIFY" = 'true' ]; then
            git commit -m 'chore(sync): merge upstream/main'
          else
            git commit -m 'chore(sync): merge upstream/main [no verify]'
          fi
          git push origin HEAD:main

          if [ "$VERSION_CHANGED" = 'true' ]; then
            echo "Upstream VERSION changed: $UPSTREAM_VERSION"
          else
            echo "Upstream synced; VERSION unchanged at $UPSTREAM_VERSION, so no fork tag will be created"
            {
              echo '### Upstream synced without release'
              echo
              echo "Upstream changes were merged, but \`VERSION\` remains \`${UPSTREAM_VERSION}\`."
              echo 'No fork tag or Release was created.'
              if [ "$NEEDS_VERIFY" != 'true' ]; then
                echo
                echo 'No toolchain ran for this merge: VERSION was unchanged and no'
                echo 'settings union had to be resolved, so there was nothing to'
                echo 'rebuild. See the step log for the merge plan.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report unresolved sync conflict
        if: steps.merge.outputs.merge_state == 'conflict'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNRESOLVED: ${{ steps.merge.outputs.unresolved }}
          UPSTREAM_VERSION: ${{ steps.merge.outputs.upstream_version }}
        run: |
          set -Eeuo pipefail
          title='Upstream sync needs a manual merge'
          files="${UNRESOLVED:-(not reported)}"
          bullet_list="$(printf '%s' "$UNRESOLVED" | tr ',' '\n' | sed 's/^/- `/; s/$/`/')"
          {
            echo '### Upstream sync needs a manual merge'
            echo
            echo "upstream/main advances to VERSION \`${UPSTREAM_VERSION:-unknown}\` and conflicts with fork \`main\`."
            echo
            echo 'The additive settings files were union-resolved and verified by a build; these files still need a human:'
            echo
            echo "$bullet_list"
            echo
            echo "The merge was aborted, so \`main\` is untouched. See the [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } >> "$GITHUB_STEP_SUMMARY"

          body="$(printf 'Conflicting paths:\n\n%s\n\nMerge upstream/main into main, keep the fork risk-control behaviour, then push.\nThis issue is refreshed by every scheduled run until the merge lands.\n\nRun: %s/%s/actions/runs/%s\n' "$files" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          # One open issue is refreshed instead of opening a new one, so the
          # 15-minute schedule cannot turn a conflict into tracker spam. Issues
          # are disabled on this fork, so every issue call below is best-effort:
          # the summary above and the deliberate failure at the end of this step
          # are the real signal.
          if ! issue_json="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Upstream sync needs a manual merge in:title' --json number,title 2>&1)"; then
            echo "::warning::Cannot query issues; see the job summary above. $issue_json"
          else
            number="$(printf '%s' "$issue_json" | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')"
            if [ -n "$number" ]; then
              if ! gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null 2>&1; then
                echo "::warning::Cannot comment on issue #$number; see the job summary above."
              else
                echo "refreshed issue #$number"
              fi
            elif ! gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug >/dev/null 2>&1; then
              echo "::warning::Cannot open a conflict issue; see the job summary above."
            else
              echo 'opened a new conflict issue'
            fi
          fi

          # Fail on purpose: a red run is how a human notices that upstream
          # advanced and needs a manual merge. The annotation keeps the reason
          # legible even when the issue tracker cannot be used.
          echo "::error::Upstream $UPSTREAM_VERSION conflicts with fork main in $files; main is untouched"
          exit 1

      - name: Create fork release tag
        id: bump
        if: steps.merge.outputs.version_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          # Upstream baseline version embedded at build time (no leading 'v').
          BASE_VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [ -z "$BASE_VERSION" ]; then
            echo '::error::Could not read backend/cmd/server/VERSION; skipping fork tag'
            exit 1
          fi
          BASE_VERSION="${BASE_VERSION#v}"
          echo "base_version=$BASE_VERSION"

          # Re-fetch + list existing fork tags for this baseline.
          git fetch --tags origin
          echo "existing tags for $BASE_VERSION:"
          git ls-remote --tags origin "refs/tags/v${BASE_VERSION}-fork.*" | grep -oE "v${BASE_VERSION}-fork\.[0-9]+$" | sort -V || true

          next_rev=1
          latest_rev=$(git ls-remote --tags origin "refs/tags/v${BASE_VERSION}-fork.*" \
            | grep -oE "v${BASE_VERSION}-fork\.[0-9]+$" \
            | sed "s/^v${BASE_VERSION}-fork\.//" \
            | sort -n \
            | tail -1 || true)
          if [ -n "$latest_rev" ]; then
            next_rev=$((latest_rev + 1))
          fi

          TAG="v${BASE_VERSION}-fork.${next_rev}"
          echo "next_tag=$TAG"

          # Same-tag guard in case a previous run raced ahead.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "::warning::Tag $TAG already exists; skipping bump"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -a "$TAG" -m "chore(release): fork build ${TAG}"
          git push origin "$TAG"
          echo "pushed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Trigger fork release workflow
        if: steps.merge.outputs.version_changed == 'true' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUMPED_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -Eeuo pipefail
          TAG="${RELEASE_TAG:-$BUMPED_TAG}"
          if [ -z "$TAG" ]; then
            echo '::error::No release tag was provided or generated'
            exit 1
          fi
          echo "dispatching Release for $TAG in $GITHUB_REPOSITORY"
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "tag=$TAG"
