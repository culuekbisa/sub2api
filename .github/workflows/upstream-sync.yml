name: Sync Upstream

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upstream-sync.yml'
  schedule:
    # Multiple staggered checks reduce the chance of a dropped scheduled event.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing fork tag to (re)dispatch Release for'
        required: false
        type: string

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'culuekbisa/sub2api'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      merge_state: ${{ steps.merge.outputs.merge_state }}
      unresolved: ${{ steps.merge.outputs.unresolved }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Merge upstream/main
        id: merge
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch --prune origin main
          git fetch --prune upstream main
          git checkout -B main origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'upstream/main is already contained in origin/main'
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare the VERSION at the last shared upstream commit with the
          # current upstream/main VERSION. This detects upstream version bumps
          # only, while ignoring README/docs/CI-only upstream commits.
          MERGE_BASE="$(git merge-base origin/main upstream/main)"
          PREVIOUS_VERSION="$(git show "${MERGE_BASE}:backend/cmd/server/VERSION" | tr -d '\r\n')"
          UPSTREAM_VERSION="$(git show "upstream/main:backend/cmd/server/VERSION" | tr -d '\r\n')"

          if [ -z "$PREVIOUS_VERSION" ] || [ -z "$UPSTREAM_VERSION" ]; then
            echo '::error::Could not read upstream VERSION before/after sync'
            exit 1
          fi

          PREVIOUS_VERSION="${PREVIOUS_VERSION#v}"
          UPSTREAM_VERSION="${UPSTREAM_VERSION#v}"
          echo "previous_upstream_version=$PREVIOUS_VERSION"
          echo "upstream_version=$UPSTREAM_VERSION"

          if [ "$PREVIOUS_VERSION" = "$UPSTREAM_VERSION" ]; then
            VERSION_CHANGED=false
          else
            VERSION_CHANGED=true
          fi

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            # Additive settings conflicts are union-resolved by the checker; the
            # remaining files are left conflicted for a human. The resolver never
            # decides on the fork's risk-control files.
            python .github/sync-tools/resolve_settings_conflicts.py --root . || true

            unresolved="$(git diff --name-only --diff-filter=U | paste -sd, -)"
            echo "unresolved=$unresolved" >> "$GITHUB_OUTPUT"

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo 'merge_state=conflict' >> "$GITHUB_OUTPUT"
              git merge --abort || true
              exit 0
            fi

            # The union is a textual guess, so it only counts as resolved when
            # the affected toolchain accepts it. Each gate runs only for trees
            # the merge actually touched: an unrelated toolchain failure (for
            # example a flaky pnpm install) must not reject a good Go-only merge.
            merged_paths="$(git diff --cached --name-only)"

            verified=true
            if printf '%s\n' "$merged_paths" | grep -q '^backend/'; then
              if (cd backend && go build ./...) >/dev/null 2>&1; then
                echo 'go build: ok'
              else
                echo 'go build: failed'
                verified=false
              fi
            fi

            if [ "$verified" = 'true' ] && printf '%s\n' "$merged_paths" | grep -q '^frontend/'; then
              if (cd frontend && pnpm install --frozen-lockfile >/dev/null 2>&1 && pnpm run typecheck >/dev/null 2>&1); then
                echo 'vue-tsc: ok'
              else
                echo 'vue-tsc: failed'
                verified=false
              fi
            fi

            if [ "$verified" = 'true' ]; then
              echo 'merge_state=auto' >> "$GITHUB_OUTPUT"
            else
              echo 'merge_state=conflict' >> "$GITHUB_OUTPUT"
              git merge --abort || true
              exit 0
            fi
          fi

          git commit -m 'chore(sync): merge upstream/main'
          git push origin HEAD:main
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$VERSION_CHANGED" = 'true' ]; then
            echo "Upstream VERSION changed: $PREVIOUS_VERSION -> $UPSTREAM_VERSION"
          else
            echo "Upstream synced; VERSION unchanged at $UPSTREAM_VERSION, so no fork tag will be created"
            {
              echo '### Upstream synced without release'
              echo
              echo "Upstream changes were merged, but \`VERSION\` remains \`$UPSTREAM_VERSION\`."
              echo 'No fork tag or Release was created.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report unresolved sync conflict
        if: steps.merge.outputs.merge_state == 'conflict'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNRESOLVED: ${{ steps.merge.outputs.unresolved }}
          UPSTREAM_VERSION: ${{ steps.merge.outputs.upstream_version }}
        run: |
          set -Eeuo pipefail
          title='Upstream sync needs a manual merge'
          files="${UNRESOLVED:-(not reported)}"
          bullet_list="$(printf '%s' "$UNRESOLVED" | tr ',' '\n' | sed 's/^/- `/; s/$/`/')"
          {
            echo '### Upstream sync needs a manual merge'
            echo
            echo "upstream/main advances to VERSION \`${UPSTREAM_VERSION:-unknown}\` and conflicts with fork \`main\`."
            echo
            echo 'The additive settings files were union-resolved and verified by a build; these files still need a human:'
            echo
            echo "$bullet_list"
            echo
            echo "The merge was aborted, so \`main\` is untouched. See the [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } >> "$GITHUB_STEP_SUMMARY"

          # One open issue is refreshed instead of opening a new one, so the
          # 15-minute schedule cannot turn a conflict into tracker spam.
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Upstream sync needs a manual merge in:title' --json number,title --jq '[.[] | select(.title == "'"$title"'")][0].number // empty')"
          body="$(printf 'Conflicting paths:\n\n%s\n\nMerge upstream/main into main, keep the fork risk-control behaviour, then push.\nThis issue is refreshed by every scheduled run until the merge lands.\n\nRun: %s/%s/actions/runs/%s\n' "$files" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null
            echo "refreshed issue #$number"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug >/dev/null
            echo 'opened a new conflict issue'
          fi

      - name: Create fork release tag
        id: bump
        if: steps.merge.outputs.version_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          # Upstream baseline version embedded at build time (no leading 'v').
          BASE_VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [ -z "$BASE_VERSION" ]; then
            echo '::error::Could not read backend/cmd/server/VERSION; skipping fork tag'
            exit 1
          fi
          BASE_VERSION="${BASE_VERSION#v}"
          echo "base_version=$BASE_VERSION"

          # Re-fetch + list existing fork tags for this baseline.
          git fetch --tags origin
          echo "existing tags for $BASE_VERSION:"
          git ls-remote --tags origin "refs/tags/v${BASE_VERSION}-fork.*" | grep -oE "v${BASE_VERSION}-fork\.[0-9]+$" | sort -V || true

          next_rev=1
          latest_rev=$(git ls-remote --tags origin "refs/tags/v${BASE_VERSION}-fork.*" \
            | grep -oE "v${BASE_VERSION}-fork\.[0-9]+$" \
            | sed "s/^v${BASE_VERSION}-fork\.//" \
            | sort -n \
            | tail -1 || true)
          if [ -n "$latest_rev" ]; then
            next_rev=$((latest_rev + 1))
          fi

          TAG="v${BASE_VERSION}-fork.${next_rev}"
          echo "next_tag=$TAG"

          # Same-tag guard in case a previous run raced ahead.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "::warning::Tag $TAG already exists; skipping bump"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -a "$TAG" -m "chore(release): fork build ${TAG}"
          git push origin "$TAG"
          echo "pushed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Trigger fork release workflow
        if: steps.merge.outputs.version_changed == 'true' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUMPED_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -Eeuo pipefail
          TAG="${RELEASE_TAG:-$BUMPED_TAG}"
          if [ -z "$TAG" ]; then
            echo '::error::No release tag was provided or generated'
            exit 1
          fi
          echo "dispatching Release for $TAG in $GITHUB_REPOSITORY"
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "tag=$TAG"
